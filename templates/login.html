<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 - 苏客科技ERP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body class="login-body">
    <div class="login-card">
      <div class="login-header">
        <span class="badge">苏客科技</span>
        <h1>苏客科技ERP</h1>
        <p>面向采购、库存、销售与返修的轻量化管理系统。</p>
      </div>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      <form method="post" class="form-grid single">
        {{ csrf_field() }}
        <label><span>用户名</span><input name="username" placeholder="请输入用户名" autocomplete="username"></label>
        <label><span>密码</span><input name="password" type="password" placeholder="请输入密码" autocomplete="current-password"></label>
        <button class="button" type="submit">登录</button>
      </form>
      <p class="hint">系统不再内置公开默认密码，请使用已初始化的管理员账号登录。</p>
    </div>
  </body>
</html>
